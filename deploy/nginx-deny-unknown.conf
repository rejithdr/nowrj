# Requests that do not name nowrj.com (for example someone typing the
# server's IP address, or scanners) get no answer at all, instead of the
# website over unencrypted http. Installed as the first, default site.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
