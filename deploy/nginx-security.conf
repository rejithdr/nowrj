# Security headers for every response nginx sends (installed by update.sh as
# /etc/nginx/conf.d/nowrj-security.conf, which nginx reads in its http block).
# The site's own server blocks set no add_header of their own, so they inherit these.

# Do not tell visitors which nginx version runs here, and hide the frameworks' banners.
server_tokens off;
proxy_hide_header X-Powered-By;

# Always use https for a year once a browser has seen the site over https.
add_header Strict-Transport-Security "max-age=31536000" always;
# Browsers must not guess file types (an "image" that is really a script).
add_header X-Content-Type-Options "nosniff" always;
# No other site may show NowRJ inside a frame (clickjacking).
add_header X-Frame-Options "DENY" always;
# Other sites see only "nowrj.com" when someone follows a link out, not the page.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# NowRJ needs no camera, microphone, location or payment access.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# What a page may load: its own scripts, styles and API; images from anywhere on
# https (Google profile photos); nothing in frames; forms only to NowRJ.
# Next.js puts small scripts and styles inline, hence 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
